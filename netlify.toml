[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: let React Router (createBrowserRouter) handle client-side
# routing. Without this, direct visits or refreshes on /quiz, /score, etc.
# return a 404 because Netlify looks for a file that doesn't exist.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
